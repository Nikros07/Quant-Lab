; tester_example.ini - Start des MT5-Strategietesters per Kommandozeile
; Aufruf (im Ordner des Terminals): terminal64.exe /config:tester_example.ini
; Vor dem Start: TrendFilter_MA12.ex5 muss unter MQL5\Experts liegen, die .set unter MQL5\Profiles\Tester.
; Symbolname und Kontowährung müssen zum Broker passen, sonst findet der Tester das Symbol nicht oder rechnet falsch.
[Tester]
; Name des EA ohne .ex5; Pfad relativ zu MQL5\Experts
Expert=TrendFilter_MA12
; Input-Preset (.set) mit den Eingabewerten; Pfad relativ zu MQL5\Profiles\Tester
ExpertParameters=TrendFilter_MA12.set
; Handelssymbol des Tests; muss zum Broker passen (z. B. US500)
Symbol=US500
; Zeitrahmen; die Strategie arbeitet auf D1-Balken
Period=D1
; Modellierung 2 = nur Eröffnungspreise der Balken (schnell, grob)
Model=2
; Ausführungsverzögerung in Millisekunden; 0 = ohne künstliche Verzögerung
ExecutionMode=0
; 0 = aus, nur ein Einzeltest ohne Parameter-Optimierung
Optimization=0
; Testbeginn (JJJJ.MM.TT)
FromDate=2012.01.01
; Testende (JJJJ.MM.TT)
ToDate=2026.10.01
; 0 = kein Forward-Test
ForwardMode=0
; Startkapital in Kontowährung
Deposit=10000
; Kontowährung; muss zum Broker-Konto passen
Currency=USD
; Hebel des simulierten Kontos; die Strategie selbst nutzt keinen Hebel (Exposure 1.0)
Leverage=100
; Dateiname des HTML-Berichts ohne Endung; landet im Terminal-Ordner
Report=TrendFilter_report
; 1 = vorhandenen Bericht mit gleichem Namen überschreiben
ReplaceReport=1
; 1 = Terminal nach Testende automatisch schließen
ShutdownTerminal=1
; 0 = ohne Visualisierung (schneller)
Visual=0